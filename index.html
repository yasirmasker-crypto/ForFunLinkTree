<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Future Island</title>
<meta name="description" content="Future Island — find us everywhere.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0e2c55;
    --bg-mid:#163b72;
    --bg-glow:#2c6fd1;
    --ink:#f5f8ff;
    --ink-dim:#b9caeb;
    --card-radius:22px;

    --ig-1:#F58529; --ig-2:#DD2A7B; --ig-3:#8134AF; --ig-4:#515BD4;
    --snap:#FFFC00; --snap-ink:#1a1a1a;
    --wa:#25D366;
    --yt:#FF0033;
    --fb:#1877F2;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 8%, var(--bg-glow) 0%, transparent 40%),
      radial-gradient(circle at 85% 95%, #3a8bd8 0%, transparent 35%),
      linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-mid) 55%, var(--bg-deep) 100%);
    background-attachment: fixed;
    font-family:'Inter', sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:48px 18px 24px;
    position:relative;
    overflow-x:hidden;
  }

  /* ambient floating stars */
  .stars{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
  }
  .stars span{
    position:absolute;
    background:#fff;
    border-radius:50%;
    opacity:.55;
    animation: twinkle 3.5s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{opacity:.15; transform:scale(0.8);}
    50%{opacity:.8; transform:scale(1.15);}
  }

  .page{
    position:relative;
    z-index:1;
    width:100%;
    max-width:440px;
  }

  header{
    text-align:center;
    margin-bottom:34px;
  }

  .badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:76px;
    height:76px;
    border-radius:26px;
    background:linear-gradient(160deg, #3d7fdb, #1e4d92);
    box-shadow:0 10px 30px -8px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.25);
    margin-bottom:16px;
  }

  h1{
    font-family:'Fredoka', sans-serif;
    font-weight:700;
    font-size:34px;
    letter-spacing:.5px;
    margin:0;
    line-height:1.05;
    text-transform:lowercase;
  }
  h1 span{
    display:block;
    background:linear-gradient(90deg,#ffffff, #b9d4ff);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .tagline{
    margin-top:10px;
    font-size:14px;
    color:var(--ink-dim);
    letter-spacing:.3px;
  }

  main{
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .link-bar{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:space-between;
    text-decoration:none;
    border-radius:999px;
    padding:6px 6px 6px 26px;
    min-height:64px;
    box-shadow:0 8px 20px -6px rgba(0,0,0,.45);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .link-bar:hover{
    transform:translateY(-3px) scale(1.015);
    box-shadow:0 14px 26px -6px rgba(0,0,0,.55);
  }
  .link-bar:active{ transform:translateY(0) scale(.99); }

  .label{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size:18px;
    color:#fff;
    letter-spacing:.2px;
  }

  .icon-circle{
    flex-shrink:0;
    width:52px;
    height:52px;
    border-radius:50%;
    background:rgba(255,255,255,.22);
    display:flex;
    align-items:center;
    justify-content:center;
    backdrop-filter: blur(2px);
  }
  .icon-circle svg{ width:26px; height:26px; }

  /* platform colors */
  .instagram{ background:linear-gradient(90deg, var(--ig-4), var(--ig-3) 35%, var(--ig-2) 65%, var(--ig-1)); }
  .snapchat{ background:var(--snap); }
  .snapchat .label{ color:var(--snap-ink); }
  .snapchat .icon-circle{ background:rgba(0,0,0,.12); }
  .whatsapp{ background:var(--wa); }
  .youtube{ background:var(--yt); }
  .facebook{ background:var(--fb); }

  footer{
    text-align:center;
    margin-top:40px;
    padding-bottom:20px;
    color:var(--ink-dim);
    font-size:12px;
    letter-spacing:.3px;
  }

  .horizon{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    z-index:0;
    opacity:.5;
    pointer-events:none;
  }

  @media (max-width:380px){
    h1{ font-size:28px; }
    .label{ font-size:16px; }
    .link-bar{ padding-left:20px; }
  }
</style>
</head>
<body>

  <div class="stars" id="stars"></div>

  <svg class="horizon" viewBox="0 0 500 120" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,80 C100,40 180,110 280,70 C360,40 420,90 500,60 L500,120 L0,120 Z" fill="#0a2247"/>
  </svg>

  <div class="page">
    <header>
      <div class="badge" aria-hidden="true">
        <svg width="38" height="38" viewBox="0 0 24 24" fill="none">
          <path d="M3 13c3-6 6-9 9-9s6 3 9 9-6 9-9 9-9-3-9-9Z" stroke="#fff" stroke-width="1.6"/>
          <circle cx="12" cy="13" r="3" fill="#fff"/>
        </svg>
      </div>
      <h1>future <span>island</span></h1>
      <p class="tagline">find us everywhere ✦ pick a link below</p>
    </header>

    <main>
      <a class="link-bar instagram" id="link-instagram" href="#" target="_blank" rel="noopener">
        <span class="label">Instagram</span>
        <span class="icon-circle">
          <svg viewBox="0 0 24 24" fill="none">
            <rect x="3" y="3" width="18" height="18" rx="5" stroke="#fff" stroke-width="1.8"/>
            <circle cx="12" cy="12" r="4" stroke="#fff" stroke-width="1.8"/>
            <circle cx="17.2" cy="6.8" r="1.1" fill="#fff"/>
          </svg>
        </span>
      </a>

      <a class="link-bar snapchat" id="link-snapchat" href="#" target="_blank" rel="noopener">
        <span class="label">Snapchat</span>
        <span class="icon-circle">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 3c2.8 0 4.6 2.1 4.5 4.8l-.1 2.1c1 .5 1.6.4 2 .3.3-.1.7 0 .8.4.1.4-.1.7-.4.9-.5.3-1.2.6-2 .8.1.6.6 1.4 1.8 2 .3.1.4.5.2.8-.4.6-1.5.9-2.6 1-.1.3-.2.7-.4 1-.2.3-.6.3-1 .2-.5-.1-1-.2-1.7-.1-.6.1-1.1.4-1.7.7-.5.2-1 .4-1.4.4s-.9-.2-1.4-.4c-.6-.3-1.1-.6-1.7-.7-.7-.1-1.2 0-1.7.1-.4.1-.8.1-1-.2-.2-.3-.3-.7-.4-1-1.1-.1-2.2-.4-2.6-1-.2-.3-.1-.7.2-.8 1.2-.6 1.7-1.4 1.8-2-.8-.2-1.5-.5-2-.8-.3-.2-.5-.5-.4-.9.1-.4.5-.5.8-.4.4.1 1 .2 2-.3l-.1-2.1C7.4 5.1 9.2 3 12 3Z" stroke="#1a1a1a" stroke-width="1.4" stroke-linejoin="round"/>
          </svg>
        </span>
      </a>

      <a class="link-bar whatsapp" id="link-whatsapp" href="#" target="_blank" rel="noopener">
        <span class="label">WhatsApp</span>
        <span class="icon-circle">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M6.5 17.5 4 20l2.6-.7c1.6.9 3.4 1.2 5.1.9 4.2-.7 7.1-4.6 6.5-8.8-.7-4.2-4.6-7.1-8.8-6.5C5.2 5.6 2.3 9.5 3 13.7c.2 1.4.8 2.7 1.7 3.7Z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
            <path d="M9.2 9.6c.2-.5.5-.5.7-.5h.5c.2 0 .4 0 .5.4.2.5.6 1.6.6 1.7.1.1.1.3 0 .4-.1.2-.2.3-.3.4-.1.1-.3.3-.4.4-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.5 1.5.3.1.5.1.6-.1.2-.2.7-.8.9-1.1.2-.2.4-.2.6-.1l1.5.7c.2.1.4.2.4.3.1.2.1 1-.3 1.5-.4.6-1.6 1-2.3 1-.6 0-2.5-.3-4.2-1.8-1.6-1.4-2.7-3.1-2.9-3.4-.2-.3-1-1.3-1-2.5 0-1.2.6-1.8.8-2Z" fill="#fff"/>
          </svg>
        </span>
      </a>

      <a class="link-bar youtube" id="link-youtube" href="#" target="_blank" rel="noopener">
        <span class="label">YouTube</span>
        <span class="icon-circle">
          <svg viewBox="0 0 24 24" fill="none">
            <rect x="2.5" y="6" width="19" height="12" rx="4" stroke="#fff" stroke-width="1.7"/>
            <path d="M10.5 9.5v5l4.3-2.5-4.3-2.5Z" fill="#fff"/>
          </svg>
        </span>
      </a>

      <a class="link-bar facebook" id="link-facebook" href="#" target="_blank" rel="noopener">
        <span class="label">Facebook</span>
        <span class="icon-circle">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M14 21v-7h2.4l.4-3H14V8.9c0-.9.2-1.5 1.5-1.5H17V4.8c-.3 0-1.2-.1-2.3-.1-2.3 0-3.9 1.4-3.9 4v2.2H8.5v3H10.8v7h3.2Z" fill="#fff"/>
          </svg>
        </span>
      </a>
    </main>

    <footer>
      future island &middot; est. for the next generation
    </footer>
  </div>

  <script>
    // ============================================
    //  EDIT YOUR LINKS HERE — the only place you need to touch
    // ============================================
    const LINKS = {
      instagram: "",   // e.g. "https://instagram.com/futureisland"
      snapchat:  "",   // e.g. "https://snapchat.com/add/futureisland"
      whatsapp:  "",   // e.g. "https://wa.me/15551234567"
      youtube:   "",   // e.g. "https://youtube.com/@futureisland"
      facebook:  ""    // e.g. "https://facebook.com/futureisland"
    };
    // ============================================

    Object.entries(LINKS).forEach(([key, url]) => {
      const el = document.getElementById('link-' + key);
      if (el && url) el.href = url;
    });

    // ambient stars
    const starsContainer = document.getElementById('stars');
    const STAR_COUNT = 28;
    for (let i = 0; i < STAR_COUNT; i++) {
      const s = document.createElement('span');
      const size = Math.random() * 2.5 + 1;
      s.style.width = size + 'px';
      s.style.height = size + 'px';
      s.style.left = Math.random() * 100 + '%';
      s.style.top = Math.random() * 70 + '%';
      s.style.animationDelay = (Math.random() * 3.5) + 's';
      starsContainer.appendChild(s);
    }
  </script>
</body>
</html>
